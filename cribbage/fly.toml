# Fly.io config for the live app. Deploys run automatically from GitHub when
# cribbage changes are merged to master (.github/workflows/deploy-cribbage.yml),
# or by hand with `fly deploy` from this folder.
#
# VAPID_SUBJECT (contact address for push notifications) is a Fly secret, set with
#   fly secrets set VAPID_SUBJECT=mailto:you@example.com
app = "cribbage-with-friends"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/cribbage.db"

[mounts]
  source = "crib_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
